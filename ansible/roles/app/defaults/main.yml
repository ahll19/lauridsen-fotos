# --- Where things live on the host -------------------------------------------
app_dir: /opt/lauridsen-fotos
data_dir: /data
app_user: fotos
app_uid: 1000
# Fixed by `name:` in docker-compose.yml; here so the playbooks can name containers.
compose_project: lauridsen-fotos

# Compose files layered on top of the two every deployment uses. The rehearsal adds one.
compose_extra_files: []

# --- What to deploy ----------------------------------------------------------
# Where the host pulls the code from. It has to be readable without a credential: the host
# holds none (ADR 0007).
app_repo_url: https://github.com/ahll19/lauridsen-fotos.git
# The host's bare copy of it.
app_repo_dir: "{{ app_dir }}/repo.git"
# A branch, tag or commit in that repository. Only what has been pushed can be deployed.
deploy_ref: main
# Older releases kept on disk for a quick look at what used to run.
app_keep_releases: 3
# Rebuild on top of freshly pulled base images. update.yml turns this on.
app_pull_images: false

# --- Names -------------------------------------------------------------------
site_domain: ""
site_alternate_domains: []
site_domains: "{{ [site_domain] + site_alternate_domains }}"

# --- In front of the server (ADR 0008) ---------------------------------------
# The stack serves plain HTTP on this port. TLS is terminated by a reverse proxy in front,
# which is not managed here.
http_port: 80
# That proxy, as this server sees it connect: addresses or CIDR ranges. nginx refuses
# everyone else. Empty means anyone may connect, and the deploy says so.
upstream_proxy_addresses: []

# --- The application ---------------------------------------------------------
django_time_zone: Europe/Copenhagen
django_language_code: da
django_hsts_seconds: 31536000
django_log_level: INFO
app_port: 8000
gunicorn_workers: 3
gunicorn_timeout: 120
max_upload_size: 100m
# The proxy in front, and nginx.
trusted_proxy_count: 2

cron_schedule_expire_galleries: "0 3 * * *"
cron_schedule_purge_tombstones: "30 3 * * *"
gallery_default_expiry_days: 90
gallery_tombstone_retention_days: 30
gallery_session_max_age: 86400
gallery_unlock_ratelimit: 20/h
contact_ratelimit: 5/h

# --- Mail (ADR 0004) ---------------------------------------------------------
owner_email: ""
mail_sender_domain: "{{ site_domain }}"
mail_hostname: "mail.{{ site_domain }}"
mail_from_address: "no-reply@{{ mail_sender_domain }}"
postfix_image: boky/postfix:v5.1.0-alpine
dkim_selector: mail
dkim_private_key: ""

# --- After the deploy --------------------------------------------------------
# How long to wait for the site to answer before calling the deploy failed.
healthcheck_retries: 36
healthcheck_delay: 5
