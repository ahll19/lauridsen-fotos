docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Container logs are kept by Docker, and without a limit they grow until the disk is full.
docker_log_max_size: 10m
docker_log_max_files: 5

docker_arch_map:
  x86_64: amd64
  aarch64: arm64
