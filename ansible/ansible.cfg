# Run everything from this directory: Ansible reads this file from where it is started.
# README.md beside it lists the commands.
[defaults]
inventory = inventory/production
roles_path = roles
# Collections are installed beside the playbooks rather than into the home directory, so
# the versions pinned in requirements.yml are the ones that run.
collections_path = .collections
interpreter_python = auto_silent
retry_files_enabled = False
# A new host's key is remembered on first contact and checked from then on.
host_key_checking = True
callback_result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[su_become_plugin]
# Only used on the first run, with --become-method su. A login shell, so root gets its own
# PATH: without it su keeps the operator's, which has no sbin directory, and installing a
# package fails partway through.
flags = -l
