# Pull a revision onto the host, build it there, restart the stack, and fail unless the
# site answers afterwards.
#
#   ansible-playbook playbooks/deploy.yml -J                     what is on main
#   ansible-playbook playbooks/deploy.yml -J -e deploy_ref=v1.0.0
- name: Deploy the application
  hosts: site
  become: true
  roles:
    - app
