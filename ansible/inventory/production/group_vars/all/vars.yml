# What is specific to the real host. Everything else has a default in a role's
# defaults/main.yml, and can be overridden here.
#
# Secrets are not in this file. They live in vault.yml beside it, encrypted, and are
# referred to from here by name.

# --- Who and where -----------------------------------------------------------
site_domain: lauridsen-fotos.dk
site_alternate_domains:
  - www.lauridsen-fotos.dk

# How the playbooks log in: as this account, which already exists on the server, with one
# of the keys in trusted_keys.yml beside this file. No password is stored anywhere. The one run that needs passwords, before the
# key is installed, asks for them (ansible/README.md, ADR 0011).
operator_user: anders
ansible_user: "{{ operator_user }}"

# --- The reverse proxy in front ----------------------------------------------
# It terminates TLS and forwards to this server's port 80 (ADR 0008). Its address as this
# server sees it connect; nginx refuses everyone else. Empty lets anyone connect.
upstream_proxy_addresses:
  - "192.168.1.64"

# --- Mail --------------------------------------------------------------------
# A mailbox you read, not on the site's own domain: contact-form messages and error
# reports go here.
owner_email: ""

# --- Backups -----------------------------------------------------------------
# The home NAS, as the VPS reaches it over SSH. Empty until there is one to point at;
# backup.yml refuses to install a job that has nowhere to send to.
backup_target_host: ""
backup_target_user: backup
backup_target_port: 22
backup_target_path: /volume1/backups/lauridsen-fotos

# --- Secrets, by reference ---------------------------------------------------
django_secret_key: "{{ vault_django_secret_key }}"
django_admin_path: "{{ vault_django_admin_path }}"
dkim_private_key: "{{ vault_dkim_private_key }}"
backup_ssh_private_key: "{{ vault_backup_ssh_private_key }}"
