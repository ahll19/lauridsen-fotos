{% load i18n %}{% get_current_language as social_language %}<meta name="description" content="{{ meta_description|default:site_description }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:title" content="{{ meta_title|default:site_name }}">
  <meta property="og:description" content="{{ meta_description|default:site_description }}">
  <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
  <meta property="og:locale" content="{% if social_language == 'da' %}da_DK{% else %}en_GB{% endif %}">
  {% if meta_image %}<meta property="og:image" content="{{ meta_image }}">
  <meta name="twitter:card" content="summary_large_image">{% else %}<meta name="twitter:card" content="summary">{% endif %}
