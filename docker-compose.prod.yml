# What the VPS runs on top of docker-compose.yml. Never used on a laptop.
#
# The host's .env sets COMPOSE_FILE to both files, so every `docker compose` command there
# picks this up without being told. It is written by Ansible (roles/app), not by hand.
#
# Two differences from development: the application runs the code baked into its image
# rather than a mounted source tree, and the reverse proxy listens on port 80. Nothing here
# handles certificates: TLS ends at the reverse proxy in front of the server (ADR 0008).

services:
  reverse-proxy:
    ports: !override
      - "${HTTP_PORT:-80}:80"

  app:
    # The image is the source of truth here: no source tree is mounted over it.
    volumes: !override
      - ${DATA_DIR:-/data}:/data
      - static_files:/srv/static

  app-cron:
    volumes: !override
      - ${DATA_DIR:-/data}:/data
