# The stack described in architecture.md, as it runs on a laptop. The VPS adds
# docker-compose.prod.yml on top: real ports, no mounted source, and certbot.
#
# Every port, path, schedule and image tag comes from .env — see .env.example.

name: lauridsen-fotos

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      # Consumed by the official image's envsubst templating of docker/nginx/templates/.
      APP_HOST: app
      APP_PORT: ${APP_PORT:-8000}
      # http here; https on the VPS, where docker-compose.prod.yml adds the certificate.
      NGINX_MODE: ${NGINX_MODE:-http}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-100m}
      # Safe default: revalidate. Only hashed filenames may be called immutable.
      STATIC_CACHE_CONTROL: ${STATIC_CACHE_CONTROL:-public, max-age=0, must-revalidate}
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      # Read-only: nginx serves these, the app writes them.
      - ${DATA_DIR:-./data}:/data:ro
      - static_files:/srv/static:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file:
      # Optional so `docker compose config` can validate this file in CI, where there is
      # no .env. Running the stack without one still works — every value has a default.
      #
      # Templated so scripts/prodcheck.sh can run the stack against a generated
      # production-mode file without touching the .env you develop against.
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      DATA_ROOT: /data
    volumes:
      - ${DATA_DIR:-./data}:/data
      - static_files:/srv/static
      # Source is mounted so edits are picked up without a rebuild during local
      # development. docker-compose.prod.yml drops it on the VPS, where the image is the
      # source of truth.
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('APP_PORT','8000')}/healthz\").read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app-cron:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    command: ["cron"]
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      DATA_ROOT: /data
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./src:/app/src
    depends_on:
      app:
        condition: service_healthy

  # --- Mail relay ------------------------------------------------------------
  # Two services for one job, because they have nothing in common but speaking SMTP.
  # Mailpit catches mail and shows it in a browser; Postfix queues it and delivers it to
  # each recipient's own mail server. Trying to express both as one service definition
  # would mean a pile of variables where most are meaningless for whichever one is running.
  #
  # COMPOSE_PROFILES in .env picks one. Both answer to the name `mail-relay` on the Docker
  # network, so EMAIL_HOST never has to change — only EMAIL_PORT, which the two images
  # disagree about.

  mailpit:
    profiles: ["dev"]
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_MAX_MESSAGES: "500"
    ports:
      # Local only: the web UI for reading captured mail. The SMTP port is deliberately
      # not published — only the internal Docker network reaches it.
      - "${MAIL_UI_PORT:-8025}:8025"
    networks:
      default:
        aliases: [mail-relay]

  postfix:
    profiles: ["prod"]
    image: ${POSTFIX_IMAGE:-boky/postfix:v5.1.0-alpine}
    restart: unless-stopped
    # The name this relay gives when it greets a recipient's mail server. It has to match
    # the host's reverse DNS or receivers treat the mail as forged — see ADR 0004.
    hostname: ${MAIL_HOSTNAME:-mail.lauridsen-fotos.dk}
    environment:
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-mail.lauridsen-fotos.dk}
      # Refuse to send as anyone else. Without this the relay would happily put any From
      # address on a message, which is what makes an open relay worth abusing.
      ALLOWED_SENDER_DOMAINS: ${MAIL_SENDER_DOMAIN:-lauridsen-fotos.dk}
      # The name the DKIM public key is published under: <selector>._domainkey.<domain>.
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      # No RELAYHOST on purpose: mail goes straight to the recipient's MX (ADR 0004).
      POSTFIX_message_size_limit: "26214400"
    volumes:
      # DKIM signing keys, one <domain>.private per sending domain. Absent locally, where
      # nothing is delivered and so nothing needs signing; placed here by Ansible on the
      # VPS. Read-only: the relay signs with them and never rewrites them.
      - ${MAIL_DKIM_KEYS_DIR:-./docker/mail/dkim}:/etc/opendkim/keys:ro
      # A named volume rather than a bind mount: Postfix is strict about the ownership and
      # permissions of its queue directories, and it keeps them correct itself as long as
      # nothing else owns the path. Survives a restart, so a deferred message is retried
      # rather than lost.
      - mail_spool:/var/spool/postfix
    # No published ports at all. The relay is reachable only from the Docker network, which
    # is the whole reason it can be left without authentication.
    networks:
      default:
        aliases: [mail-relay]

volumes:
  static_files:
  mail_spool:
